<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RO Lounge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&family=Pixelify+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1b2230;
        --panel: #263149;
        --panel-2: #2f3d5c;
        --edge: #0f1420;
        --gold: #ffe27a;
        --text: #f3efe2;
        --blue: #6fb7f0;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text);
        font-family: "Pixelify Sans", "Noto Sans Thai", system-ui, sans-serif; font-size: 16px; }
      #game { position: fixed; inset: 0; }
      #game canvas { image-rendering: pixelated; }

      /* กรอบสไตล์พิกเซล (มุมตัด) */
      .panel {
        background: var(--panel);
        border: 3px solid var(--edge);
        box-shadow: inset 0 0 0 3px var(--panel-2), 0 4px 0 var(--edge);
        clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px),
          calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px);
      }
      input, select {
        padding: 10px 12px; border: 3px solid var(--edge); background: #141b2b; color: var(--text);
        font: inherit; font-size: 16px; outline: none; width: 100%;
      }
      input:focus, select:focus { border-color: var(--blue); }
      button {
        padding: 9px 14px; border: 3px solid var(--edge); background: var(--blue); color: #0b1622;
        font: inherit; font-weight: 600; cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0,0,0,.22);
      }
      button:hover { filter: brightness(1.08); }
      button:active { transform: translateY(2px); box-shadow: none; }

      #login {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10;
        background:
          radial-gradient(ellipse at 50% 40%, #35507a 0%, transparent 60%),
          repeating-conic-gradient(#1f2a40 0 25%, #1b2438 0 50%) 0 0 / 24px 24px;
      }

      #hud { position: fixed; left: 12px; bottom: 12px; width: min(440px, calc(100vw - 24px));
        display: none; flex-direction: column; gap: 8px; z-index: 5; }
      #log { max-height: 130px; min-height: 40px; overflow-y: auto; padding: 8px 12px; font-size: 15px; line-height: 1.5;
        font-family: "Noto Sans Thai", "Pixelify Sans", sans-serif; background: rgba(27,34,48,.82);
        border: 3px solid var(--edge); }
      #log .who { font-weight: 600; color: var(--gold); }
      #row { display: flex; gap: 6px; }
      #emotes { display: flex; gap: 6px; flex-wrap: wrap; }
      #emotes button { padding: 3px 9px; background: var(--panel-2); color: inherit; font-size: 20px; }
      #status { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); font-size: 15px; z-index: 20;
        padding: 4px 12px; background: rgba(27,34,48,.9); border: 3px solid var(--edge); display: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="status"></div>

    <div id="login">
      <form id="loginForm" class="panel">
        <header class="creator-header">
          <div><span class="creator-kicker">RO LOUNGE / NEW ADVENTURE</span><h1>สร้างตัวละคร</h1></div>
          <span class="creator-badge">NOVICE · LV. 1</span>
        </header>
        <div id="customize"></div>
        <footer class="creator-footer">
          <label for="nameInput">ชื่อตัวละคร
            <input id="nameInput" maxlength="16" placeholder="ตั้งชื่อนักผจญภัยของคุณ" autocomplete="off" />
          </label>
          <button type="submit">เข้าเมือง <span aria-hidden="true">➜</span></button>
        </footer>
      </form>
    </div>

    <div id="hud">
      <div id="log"></div>
      <div id="emotes"></div>
      <form id="chatForm">
        <div id="row">
          <input id="chatInput" maxlength="120" placeholder="พิมพ์แล้วกด Enter" autocomplete="off" />
          <button type="submit">ส่ง</button>
        </div>
      </form>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
